<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Enlaces BodaCD</title>
    <style>
        :root {
            --bg-dark: #050510;
            --glass-bg: rgba(16, 20, 35, 0.65);
            --neon-cyan: #00f3ff;
            --neon-purple: #9d4edd;
            --text-main: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a153a 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Contenedor con efecto cristal */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 
                        inset 0 0 20px rgba(157, 78, 221, 0.05);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            position: relative;
        }

        /* Luz superior para dar volumen */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.5;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-size: 0.85em;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #8b9bb4;
        }

        input {
            width: 100%;
            padding: 10px 0;
            margin-top: 5px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-bottom-color: var(--neon-cyan);
            box-shadow: 0 4px 10px -4px rgba(0, 243, 255, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-style: italic;
        }

        button {
            width: 100%;
            margin-top: 40px;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            font-weight: bold;
        }

        #resultado {
            margin-top: 25px;
            word-break: break-all;
            font-size: 0.9em;
            text-align: center;
            line-height: 1.5;
            min-height: 40px;
        }

        #resultado a {
            color: var(--neon-purple);
            text-decoration: none;
            text-shadow: 0 0 8px rgba(157, 78, 221, 0.6);
            transition: color 0.3s, text-shadow 0.3s;
            display: inline-block;
            margin-top: 10px;
        }

        #resultado a:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generador de Pases</h2>
        
        <label>Invitado</label>
        <input type="text" id="nombre" placeholder="Familia Pérez" autocomplete="off">
        
        <label>Total de Pases</label>
        <input type="number" id="pases" placeholder="4" min="1" autocomplete="off">
        
        <label>Mesa Asignada</label>
        <input type="text" id="mesa" placeholder="12" autocomplete="off">
        
        <button onclick="generarEnlace()">Crear Enlace Seguro</button>
        
        <div id="resultado"></div>
    </div>

    <script>
        const SECRET_KEY = "BodaCD26";

        function generarEnlace() {
            const nombre = document.getElementById("nombre").value.trim();
            const pases = document.getElementById("pases").value.trim();
            const mesa = document.getElementById("mesa").value.trim();

            if (!nombre || !pases || !mesa) {
                const res = document.getElementById("resultado");
                res.innerHTML = '<span style="color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d;">Completa todos los campos.</span>';
                return;
            }

            const raw = nombre + "|" + pases + "|" + mesa;
            let encrypted = "";
            
            for (let i = 0; i < raw.length; i++) {
                encrypted += String.fromCharCode(raw.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
            }

            const finalCode = encodeURIComponent(btoa(encrypted));
            const url = "https://carloscjarquin.github.io/BodaCD/?c=" + finalCode;

            document.getElementById("resultado").innerHTML = `
                <span style="color: #8b9bb4;">Enlace generado:</span><br>
                <a href="${url}" target="_blank">${url}</a>
            `;
        }
    </script>
</body>
</html>
